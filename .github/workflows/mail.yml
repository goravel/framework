name: Test
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'mail/**'
      - '.github/workflows/mail.yml'
env:
  MAIL_HOST: ${{ secrets.MAIL_HOST }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
  MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  MAIL_CC: ${{ secrets.MAIL_CC }}
  MAIL_BCC: ${{ secrets.MAIL_BCC }}
jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Install dependencies
        run: go mod tidy
      # Master merge: run the cheap unit tests, then send exactly one mail.
      - name: Run mail unit tests
        if: github.event_name == 'push'
        run: go test ./mail/... -skip '^TestApplicationTestSuite$'
      - name: Send one mail to verify delivery
        if: github.event_name == 'push'
        run: go test ./mail/... -run '^TestApplicationTestSuite$/^TestSendMail$' -v
      # Mail code changed: run everything, including all live mail tests.
      - name: Run tests
        if: github.event_name != 'push'
        run: go test ./mail/...
